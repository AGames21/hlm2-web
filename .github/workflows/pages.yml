# Publishes web/ (code only) to GitHub Pages. Game files are never in the
# repo: each player loads their own .wad in the page.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run simulation regression tests
        run: node --test tests/*.test.mjs
      - name: Prepare browser playtest tools
        run: |
          npm install --prefix "$RUNNER_TEMP/hlm2-playtest" --no-audit --no-fund playwright@1.62.1
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Run browser playtest before publishing
        env:
          NODE_PATH: ${{ runner.temp }}/hlm2-playtest/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/browser/playtest.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
